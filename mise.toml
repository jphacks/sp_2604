[settings]
minimum_release_age = "7d"

[tools]
jq = "1.8.1"
node = "24.11.1"
"npm:rulesync" = "29.0.0"
ruby = "3.4.11"
terraform = "1.16.4"
xcodes = "2.1.0"

[tasks.bootstrap]
description = ""
run = [
  { task = "xcode:select" },
  { task = "rulesync" },
  { task = "bundle:install" },
  { task = "certs:install" },
]

[tasks."xcode:select"]
description = "指定されたXcodeのバージョンを選択する"
run = "xcodes select"

[tasks.rulesync]
description = "rulesync で各 AI ツール向けの設定ファイルを生成する"
run = [
  "rulesync generate",
  { task = "xcode:select" },
  "xcrun agent skills export --output-dir {{config_root}}/.claude/skills/",
  "xcrun agent skills export --output-dir {{config_root}}/.agents/skills/",
]

[tasks."bundle:install"]
description = "Bundler で fastlane などの gem をインストールする"
run = "bundle install"

[tasks."certs:install"]
description = "fastlane match で証明書とプロファイルを取得する (読み取り専用)"
run = "bundle exec fastlane ios certificates"

[tasks."certs:update"]
description = "fastlane match で証明書とプロファイルを作成・更新する"
run = "bundle exec fastlane ios renew_certificates"

[tasks."certs:register-device"]
description = "デバイスを登録して Development プロファイルを更新する (例: mise run register-device -- name:iPhone udid:XXXX)"
run = "bundle exec fastlane ios add_device"

[tasks."test:ui"]
description = "iPhone 18 Pro シミュレーターで UI テストを実行する"
run = """
rm -rf TestResults.xcresult
xcrun simctl bootstatus 'iPhone 18 Pro' -b
xcodebuild test \
  -workspace Dareda.xcworkspace \
  -scheme Dareda \
  -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
  -only-testing:DaredaUITests \
  -parallel-testing-enabled NO \
  -resultBundlePath TestResults.xcresult \
  -skipMacroValidation \
  -skipPackagePluginValidation \
  CODE_SIGN_IDENTITY=-
"""

[tasks.vrt]
description = "UI テストのスクリーンショットを reg-suit で比較する (test:ui の後に実行する)"
dir = "{{config_root}}/vrt"
run = [
  "bash extract-screenshots.sh ../TestResults.xcresult actual",
  "npm install --no-audit --no-fund",
  "npx reg-suit run",
]

[tasks."terraform:init"]
description = "terraform init を実行する (例: mise run terraform:init google)"
usage = 'arg "<module>" help="root module 名 (terraform/ 配下)" {choices "github" "google"}'
run = 'terraform -chdir="terraform/${usage_module}" init'

[tasks."terraform:plan"]
description = "terraform plan を実行する (例: mise run terraform:plan google)"
usage = 'arg "<module>" help="root module 名 (terraform/ 配下)" {choices "github" "google"}'
run = 'terraform -chdir="terraform/${usage_module}" init && terraform -chdir="terraform/${usage_module}" plan'

[tasks."terraform:apply"]
description = "terraform apply を実行する (例: mise run terraform:apply google)"
usage = 'arg "<module>" help="root module 名 (terraform/ 配下)" {choices "github" "google"}'
run = 'terraform -chdir="terraform/${usage_module}" init && terraform -chdir="terraform/${usage_module}" apply'
